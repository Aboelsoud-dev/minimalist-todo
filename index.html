<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="todo-app" role="main" aria-label="Todo application">
            
            <!-- Header -->
            <header>
                <h1>
                    <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
                    To Do App
                </h1>
            </header>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-info">
                    <span id="progress-text">0% complete</span>
                    <span id="progress-count">0/0 tasks</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <!-- Input Form -->
            <form class="input-area" id="todo-form" role="form" aria-label="Add new task">
                <label for="task-input" class="sr-only">Enter a new task</label>
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="Add a new task..." 
                    autocomplete="off"
                    required
                    aria-required="true"
                >
                <button type="submit" id="add-task-btn" aria-label="Add task">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                </button>
            </form>

            <!-- Todo List Container -->
            <div class="todos-container">
                <div id="todo-list-wrapper" role="list" aria-label="Task list">
                    <ul id="todo-list">
                        <!-- Todos will be dynamically added here -->
                    </ul>
                    
                    <!-- Empty State -->
                    <div id="empty-state" class="empty-state" aria-hidden="true">
                        <span>📝</span>
                        No tasks yet. Add one above!
                    </div>
                </div>
            </div>

            <!-- Footer with stats -->
            <footer class="todo-footer" id="todo-footer">
                <span id="task-counter" aria-live="polite">
                    <i class="fa-regular fa-circle-check" aria-hidden="true"></i>
                    <span id="task-count">0</span> tasks
                </span>
                <button id="clear-completed-btn" class="clear-btn" aria-label="Clear completed tasks">
                    <i class="fa-regular fa-trash-can" aria-hidden="true"></i>
                    Clear Completed
                </button>
            </footer>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
